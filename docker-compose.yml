services:
  portfolio:
    build: .
    container_name: smile-portfolio
    restart: unless-stopped
    # Bound to loopback only — the container is never reachable from the
    # internet directly. nginx (on the host, not in Docker) is the only
    # thing that can reach it, and nginx is what the public actually hits
    # on 80/443.
    ports:
      - "127.0.0.1:8080:8080"
    # Kept outside the repo directory on purpose — it never risks being
    # swept up by a stray `git add -A` even though .gitignore already
    # covers .env. Absolute path, so this works regardless of where the
    # repo itself is checked out.
    env_file:
      - /opt/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
