# nginx site config for smilekisan.com — TLS termination + reverse proxy to
# the app container on 127.0.0.1:8080. Install to
# /etc/nginx/sites-available/smilekisan.com and symlink into sites-enabled
# (see the deploy script). Certbot rewrites the server{} block for 443 the
# first time it runs — the version below already reflects that end state so
# you know what to expect; certbot only needs the port-80 block to exist to
# do its ACME challenge on first run.

server {
    listen 80;
    listen [::]:80;
    server_name smilekisan.com www.smilekisan.com;

    # certbot's webroot challenge lives here during renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smilekisan.com www.smilekisan.com;

    ssl_certificate     /etc/letsencrypt/live/smilekisan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smilekisan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers — the app itself sets none of these, nginx is the
    # right layer since it's the actual public-facing edge.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
